<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syfielbox - ElytraPvP Sunucusu</title>
  
  <!-- Fontlar: Gamer başlıklar ve Modern Gövde metinleri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- FontAwesome İkon Seti -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: #090a0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Dinamik Işık ve Izgara Arka Planı */
    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
    }

    .glow-purple {
      position: absolute;
      width: 450px;
      height: 450px;
      background: #8a2be2;
      filter: blur(160px);
      opacity: 0.35;
      top: 10%;
      left: 15%;
      border-radius: 50%;
      animation: pulse 6s ease-in-out infinite alternate;
      z-index: 1;
    }

    .glow-cyan {
      position: absolute;
      width: 400px;
      height: 400px;
      background: #00f2fe;
      filter: blur(160px);
      opacity: 0.3;
      bottom: 10%;
      right: 15%;
      border-radius: 50%;
      animation: pulse 8s ease-in-out infinite alternate-reverse;
      z-index: 1;
    }

    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.15) translate(20px, -20px); }
    }

    /* Ana Konteyner */
    .main-card {
      position: relative;
      z-index: 2;
      background: rgba(18, 20, 29, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.5rem 3rem;
      max-width: 800px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
    }

    /* Sunucu Başlığı */
    .server-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 0 15px rgba(138, 43, 226, 0.8);
      margin-bottom: 0.8rem;
      letter-spacing: 2px;
    }

    .server-subtitle {
      color: #00f2fe;
      font-weight: 600;
      letter-spacing: 3px;
      font-size: 0.95rem;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    /* IP Kopyalama Butonu */
    .ip-box {
      background: rgba(0, 0, 0, 0.4);
      border: 2px dashed rgba(138, 43, 226, 0.6);
      padding: 1rem 1.5rem;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 2.5rem;
    }

    .ip-box:hover {
      border-color: #00f2fe;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 242, 254, 0.2);
    }

    .ip-text {
      font-family: 'Press Start 2P', cursive;
      font-size: 1rem;
      color: #fff;
    }

    .copy-btn {
      background: linear-gradient(135deg, #8a2be2, #4a00e0);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Mağaza & Kredi Butonları Grid */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .nav-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.2rem;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .nav-card i {
      font-size: 1.8rem;
      color: #8a2be2;
      transition: all 0.3s ease;
    }

    .nav-card:hover {
      background: rgba(138, 43, 226, 0.15);
      border-color: #8a2be2;
      transform: translateY(-5px);
    }

    .nav-card:hover i {
      color: #00f2fe;
      transform: scale(1.1);
    }

    .nav-card span {
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Bildirim Toast */
    .toast {
      position: fixed;
      bottom: -60px;
      background: #00f2fe;
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      transition: all 0.4s ease;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
    }

    .toast.show {
      bottom: 30px;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="glow-purple"></div>
  <div class="glow-cyan"></div>

  <div class="main-card">
    <div class="server-title">SYFIELBOX</div>
    <div class="server-subtitle"><i class="fa-solid fa-feather-pointed"></i> ElytraPvP Sunucusu</div>

    <!-- Tıklayınca IP Kopyalayan Alan -->
    <div class="ip-box" onclick="copyIp()">
      <i class="fa-solid fa-server" style="color: #00f2fe;"></i>
      <span class="ip-text">play.syfielbox.fun</span>
      <div class="copy-btn"><i class="fa-regular fa-copy"></i> KOPYALA</div>
    </div>

    <!-- Menü Kartları -->
    <div class="nav-grid">
      <a href="#" class="nav-card">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Magaza</span>
      </a>
      <a href="#" class="nav-card">
        <i class="fa-solid fa-coins"></i>
        <span>Kredi Yukle</span>
      </a>
      <a href="#" class="nav-card">
        <i class="fa-brands fa-discord"></i>
        <span>Discord</span>
      </a>
    </div>
  </div>

  <!-- Kopyalandı Bildirimi -->
  <div id="toast" class="toast">IP ADRESİ KOPYALANDI!</div>

  <script>
    function copyIp() {
      const ip = "play.syfielbox.fun";
      navigator.clipboard.writeText(ip);
      
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }
  </script>
</body>
</html>
