<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelecek Nesil Web</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Arka Plan Animasyonu (Glow & Blob) */
    .bg-blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.6;
      animation: float 8s ease-in-out infinite alternate;
      z-index: 1;
    }

    .bg-blob-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #00dfd8, #007cf0);
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.5;
      animation: float2 10s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translate(-30%, -30%) scale(1); }
      100% { transform: translate(20%, 20%) scale(1.2); }
    }

    @keyframes float2 {
      0% { transform: translate(30%, 30%) scale(1.2); }
      100% { transform: translate(-20%, -20%) scale(0.9); }
    }

    /* Ana İçerik Kartı (Glassmorphism Effect) */
    .container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem 4rem;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      max-width: 600px;
      animation: fadeIn 1.2s ease-out;
    }

    /* Animasyonlu Gradient Başlık */
    h1 {
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #00dfd8, #007cf0, #ff007f);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: textGradient 4s linear infinite;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    p {
      font-size: 1.1rem;
      font-weight: 300;
      color: #c5c6c7;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* Parlayan Buton */
    .btn {
      display: inline-block;
      padding: 14px 38px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(90deg, #7928ca, #ff007f);
      border-radius: 50px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.7);
    }

    @keyframes textGradient {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Arka plan renkli ışık alanları -->
  <div class="bg-blob"></div>
  <div class="bg-blob-2"></div>

  <!-- Ön Yüz Kartı -->
  <div class="container">
    <h1>Hoş Geldiniz</h1>
    <p>Burası GitHub Pages üzerinde yayında olan yeni projenin ana sayfası. Şık typography ve modern animasyonlarla tasarlandı.</p>
    <a href="#" class="btn">Keşfetmeye Başla</a>
  </div>

</body>
</html>
